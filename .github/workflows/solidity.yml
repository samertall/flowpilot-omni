name: Solidity and JavaScript Checks
on:
  push:
  pull_request:
jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: foundry-rs/foundry-toolchain@v1
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install Solidity dependencies
        run: |
          forge install foundry-rs/forge-std --no-commit
          forge install Reactive-Network/reactive-lib-omni --no-commit
      - name: Solidity build and tests
        run: |
          forge build
          forge test -vvv
      - name: JavaScript syntax checks
        run: |
          node --check app/app.js
          node --check app/deploy.js
          node --check scripts/verify-evidence.mjs
          python3 -m py_compile scripts/export-browser-artifacts.py
      - name: Validate deployment config JSON
        run: python3 -m json.tool app/deployments.json >/dev/null

  publish-browser-deployment-artifacts:
    name: publish-browser-deployment-artifacts
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: build-and-test
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: foundry-rs/foundry-toolchain@v1
      - name: Install Solidity libraries
        run: |
          forge install foundry-rs/forge-std --no-commit
          forge install Reactive-Network/reactive-lib-omni --no-commit
      - name: Build and export ABI/creation bytecode for browser wallet setup
        run: |
          forge build
          python3 scripts/export-browser-artifacts.py
      - name: Publish reproducible browser artifacts to main branch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app/artifacts/
          if ! git diff --cached --quiet; then
            git commit -m "build: publish Foundry browser deployment artifacts [skip ci]"
            git push origin HEAD:main
          fi
