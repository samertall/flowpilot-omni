name: FlowPilot — Cloud Testnet Deployment & Evidence

on:
  push:
    branches: [main]
    paths: ['.flowpilot/trigger.json']
  workflow_dispatch:
    inputs:
      phase:
        description: 'Select preflight first. Deploy and demo require an explicit testnet approval.'
        type: choice
        required: true
        default: preflight
        options:
          - preflight
          - diagnose
          - inspect
          - faucet
          - topup
          - deploy
          - demo
          - retry
          - verify
      confirm_testnet_broadcast:
        description: 'For deploy/demo only: enter yes to authorize testnet gas, deposits and demo payment'
        required: true
        default: 'no'
        type: choice
        options:
          - 'no'
          - 'yes'

permissions:
  contents: write

concurrency:
  group: flowpilot-cloud-testnet
  cancel-in-progress: false

jobs:
  cloud:
    name: Cloud testnet (approved operation)
    if: ${{ github.event_name == 'push' || inputs.phase == 'preflight' || inputs.phase == 'diagnose' || inputs.phase == 'inspect' || inputs.phase == 'verify' || inputs.confirm_testnet_broadcast == 'yes' }}
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      BASE_RPC_URL: https://sepolia.base.org
      LASNA_RPC_URL: https://lasna-rpc.rnk.dev/
      UNI_RPC_URL: https://sepolia.unichain.org
      CLOUD_PROOF_TIMEOUT_SECONDS: '480'
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: foundry-rs/foundry-toolchain@v1
      - id: approval
        name: Resolve approved testnet phase (manual or explicit trigger file)
        shell: bash
        env:
          WORKFLOW_PHASE: ${{ inputs.phase }}
          WORKFLOW_CONFIRM: ${{ inputs.confirm_testnet_broadcast }}
        run: |
          set -euo pipefail
          python3 - <<'PYCODE'
          import json, os
          event=os.environ.get('GITHUB_EVENT_NAME')
          if event=='push':
              with open('.flowpilot/trigger.json') as f: request=json.load(f)
              phase=request.get('phase','')
              confirm=request.get('confirm_testnet_broadcast','no')
          else:
              phase=os.environ.get('WORKFLOW_PHASE','')
              confirm=os.environ.get('WORKFLOW_CONFIRM','no')
          if phase not in {'preflight','diagnose','inspect','faucet','topup','deploy','demo','retry','verify'}:
              raise SystemExit('Invalid cloud testnet phase')
          if phase in {'faucet','topup','deploy','demo','retry'} and confirm!='yes':
              raise SystemExit('On-chain transactions require explicit testnet approval')
          if confirm not in {'yes','no'}: raise SystemExit('Invalid approval value')
          with open(os.environ['GITHUB_OUTPUT'],'a') as f:
              f.write(f'phase={phase}\n')
              f.write(f'confirm={confirm}\n')
          print(f'Authorized workflow phase: {phase}; testnet broadcasting: {confirm}')
          PYCODE
          node --check scripts/cloud-runner.mjs
          python3 -m json.tool app/deployments.json >/dev/null
      - name: Install dependencies with lifecycle scripts disabled
        run: npm install --ignore-scripts --no-audit --no-fund
      - name: Compile and test the contracts (before signing)
        if: ${{ steps.approval.outputs.phase == 'deploy' || steps.approval.outputs.phase == 'diagnose' }}
        shell: bash
        run: |
          set -euo pipefail
          forge install foundry-rs/forge-std --no-commit
          forge install Reactive-Network/reactive-lib-omni --no-commit
          forge build
          forge test -q
      - id: runcloud
        name: Execute approved phase in the cloud
        shell: bash
        env:
          FLOWPILOT_TESTNET_PRIVATE_KEY: ${{ secrets.FLOWPILOT_TESTNET_PRIVATE_KEY }}
          CONFIRM_TESTNET_BROADCAST: ${{ steps.approval.outputs.confirm }}
        run: |
          set +e
          node scripts/cloud-runner.mjs '${{ steps.approval.outputs.phase }}'
          code=$?
          echo "phase_exit_code=$code" >> "$GITHUB_OUTPUT"
          exit 0
      - name: Render evidence-backed 72-second video only after verified callback
        if: ${{ (steps.approval.outputs.phase == 'demo' || steps.approval.outputs.phase == 'retry' || steps.approval.outputs.phase == 'verify') && steps.runcloud.outputs.phase_exit_code == '0' }}
        shell: bash
        run: |
          set -euo pipefail
          python3 -m pip install 'Pillow==12.0.0'
          python3 scripts/build-evidence-video.py
      - name: Upload proven execution video
        if: ${{ (steps.approval.outputs.phase == 'demo' || steps.approval.outputs.phase == 'verify') && steps.runcloud.outputs.phase_exit_code == '0' }}
        uses: actions/upload-artifact@v4
        with:
          name: flowpilot-verified-video-${{ github.run_id }}
          path: docs/flowpilot-verified-demo.mp4
          retention-days: 90
      - name: Upload public receipts and partial progress (even when pending)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: flowpilot-${{ steps.approval.outputs.phase }}-${{ github.run_id }}
          path: |
            docs/CLOUD_PREFLIGHT.json
            docs/CLOUD_LASNA_DIAGNOSIS.json
            docs/CLOUD_ESCROW_INSPECTION.json
            docs/CLOUD_FAUCET.json
            docs/CLOUD_RELAY_TOPUP.json
            deployments/CLOUD_DEPLOY_PROGRESS.json
            deployments/lasna.json
            docs/CLOUD_EVIDENCE.json
            docs/CLOUD_EVIDENCE_ATTEMPT1.json
          if-no-files-found: warn
          retention-days: 30
      - name: Publish public contract addresses and on-chain evidence
        if: ${{ steps.approval.outputs.phase != 'preflight' && steps.runcloud.outputs.phase_exit_code != '' }}
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          test ! -f deployments/lasna.json || git add deployments/lasna.json app/deployments.json
          test ! -f docs/CLOUD_FAUCET.json || git add docs/CLOUD_FAUCET.json
          test ! -f docs/CLOUD_RELAY_TOPUP.json || git add docs/CLOUD_RELAY_TOPUP.json
          test ! -f docs/CLOUD_EVIDENCE.json || git add docs/CLOUD_EVIDENCE.json
          test ! -f docs/CLOUD_EVIDENCE_ATTEMPT1.json || git add docs/CLOUD_EVIDENCE_ATTEMPT1.json
          test ! -f docs/flowpilot-verified-demo.mp4 || git add docs/flowpilot-verified-demo.mp4
          if ! git diff --cached --quiet; then
            git commit -m 'testnet: record observed deployment and callback evidence [skip ci]'
            git push origin HEAD:main
          fi
      - name: Fail if live execution was not proven
        if: ${{ steps.runcloud.outputs.phase_exit_code != '' }}
        shell: bash
        run: |
          test "${{ steps.runcloud.outputs.phase_exit_code }}" = 0 || {
            echo 'Action incomplete. Inspect logs and public receipt artifact; no successful callback has been claimed.'
            exit 1
          }
