name: Publish FlowPilot wallet demo to GitHub Pages
on:
  push:
    branches: [main]
    paths:
      - 'app/**'
      - '.github/workflows/pages.yml'
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: github-pages
  cancel-in-progress: false
jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Ensure Pages site exists
        uses: actions/configure-pages@v5
        with:
          enablement: true
      - name: Upload static app and wallet wizard
        uses: actions/upload-pages-artifact@v4
        with:
          path: ./app
      - name: Deploy GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
